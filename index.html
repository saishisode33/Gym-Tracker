<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.92);backdrop-filter:blur(12px);padding:18px 16px 10px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;padding:8px 12px;position:sticky;top:70px;z-index:4;background:var(--bg);overflow:auto}
nav button{border:0;background:#e5e7eb;border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:600}
nav button.active{background:#111827;color:#fff}
main{padding:8px 12px 40px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 1px 2px #00000008}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.date{font-weight:800;font-size:17px}.muted{color:var(--muted)}
.section{margin-top:14px}.section h3{margin:0 0 8px;font-size:15px}
.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item b{display:block}.meta{font-size:13px;color:var(--muted);margin-top:3px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.search{margin:8px 0 12px}.pill{display:inline-block;background:#eef0f3;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}
.big{font-size:34px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{background:#111827;color:white;border:0;border-radius:12px;padding:12px 15px;font-weight:700}
button.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-weight:700}
.empty{text-align:center;padding:30px;color:var(--muted)}
.small{font-size:12px}.warning{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
</style>
</head>
<body>
<header><h1>My Gym Tracker</h1><div class="sub">Your workout history, structured and searchable</div></header>
<nav id="nav">
<button data-tab="home">Home</button><button data-tab="history">History</button><button data-tab="exercises">Exercises</button><button data-tab="stats">Stats</button>
</nav>
<main id="app"></main>
<script src="data.js"></script>
<script>
const app=document.getElementById('app');
let workouts=window.GYM_DATA.workouts||[];
let tab='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function allItems(){return workouts.flatMap(w=>w.sections.flatMap(s=>s.items.map(i=>({...i,date:w.date_label,section:s.name}))));}
function card(w){
 return `<div class="card"><div class="row"><div class="date">${esc(w.date_label)}</div><div class="small muted">${w.sections.length} section${w.sections.length==1?'':'s'}</div></div>
 ${w.flags.length?`<div class="warning card small" style="margin:10px 0 0;padding:10px">${w.flags.map(esc).join('<br>')}</div>`:''}
 ${w.sections.map(s=>`<div class="section"><h3>${esc(s.name)}</h3>${s.items.map(i=>`<div class="item"><b>${esc(i.exercise)}</b><div class="meta">${i.sets?esc(i.sets)+' sets · ':''}${i.reps?esc(i.reps)+' reps · ':''}${i.weight?esc(i.weight)+' · ':''}${i.duration?esc(i.duration)+' · ':''}${i.notes?esc(i.notes):''}</div></div>`).join('')}</div>`).join('')}</div>`;
}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='home') renderHome(); else if(tab==='history') renderHistory(); else if(tab==='exercises') renderExercises(); else renderStats();
}
function renderHome(){
 const recent=[...workouts].slice(-5).reverse();
 app.innerHTML=`<div class="grid"><div class="card"><div class="big">${workouts.length}</div><div class="muted">Workout days</div></div><div class="card"><div class="big">${allItems().length}</div><div class="muted">Logged items</div></div></div>
 <div class="card"><b>What you can do now</b><p class="muted">Search your history, browse by date, and inspect any exercise. This first version is a safe prototype using your imported notes.</p></div>
 <h2>Recent</h2>${recent.map(card).join('')}`;
}
function renderHistory(){
 app.innerHTML=`<input class="search" id="hs" placeholder="Search date, muscle group, exercise..." /> <div id="hl"></div>`;
 const draw=()=>{const q=document.getElementById('hs').value.toLowerCase();document.getElementById('hl').innerHTML=workouts.filter(w=>JSON.stringify(w).toLowerCase().includes(q)).slice().reverse().map(card).join('')||'<div class="empty">No matching workouts.</div>'};
 document.getElementById('hs').oninput=draw; draw();
}
function renderExercises(){
 const names=[...new Set(allItems().map(i=>i.exercise.replace(/^\d+\.\s*/,'')))].sort((a,b)=>a.localeCompare(b));
 app.innerHTML=`<input class="search" id="es" placeholder="Search an exercise..." /><div id="el"></div>`;
 const draw=()=>{const q=document.getElementById('es').value.toLowerCase(); const n=names.filter(x=>x.toLowerCase().includes(q));
 document.getElementById('el').innerHTML=n.map(name=>{const hits=allItems().filter(i=>i.exercise.replace(/^\d+\.\s*/,'')===name);return `<div class="card"><div class="row"><b>${esc(name)}</b><span class="pill">${hits.length} log${hits.length==1?'':'s'}</span></div>${hits.slice().reverse().map(h=>`<div class="item"><b>${esc(h.date)}</b><div class="meta">${esc(h.section)} · ${h.sets?esc(h.sets)+' sets · ':''}${h.reps?esc(h.reps)+' reps · ':''}${h.weight?esc(h.weight)+' · ':''}${h.duration?esc(h.duration)+' · ':''}${h.notes?esc(h.notes):''}</div></div>`).join('')}</div>`}).join('')||'<div class="empty">No exercises found.</div>'};
 document.getElementById('es').oninput=draw; draw();
}
function renderStats(){
 const counts={}; allItems().forEach(i=>counts[i.section]=(counts[i.section]||0)+1);
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 app.innerHTML=`<div class="card"><h2>Logged activity</h2>${top.map(([k,v])=>`<div class="row item"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>
 <div class="card"><b>Data note</b><p class="muted">The imported PDF contains inconsistent dates and exercise names. I have preserved the source wording rather than silently changing your history. We will normalize names and flag date anomalies before making this your permanent database.</p></div>`;
}
document.getElementById('nav').addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}});
render();
</script>
</body></html>
