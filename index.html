<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef0f3;--danger:#b91c1c;--ok:#166534}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(14px);padding:18px 16px 8px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;padding:8px 12px;position:sticky;top:72px;z-index:19;background:var(--bg);overflow:auto}
nav button{border:0;background:#e5e7eb;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:700;color:#1677ff}
nav button.active{background:#111827;color:#fff}
main{padding:8px 12px 100px;max-width:820px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 1px 2px #00000008}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.date{font-weight:800;font-size:20px}
.muted{color:var(--muted)}.big{font-size:34px;font-weight:800}.pill{display:inline-block;background:#eef0f3;border-radius:999px;padding:5px 9px;font-size:12px;margin:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{margin-top:16px}.section h3{margin:0 0 8px;font-size:17px}.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item b{display:block}.meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.search,input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-family:inherit}
.search{margin:8px 0 12px}textarea{resize:vertical}
button.primary{background:#111827;color:white;border:0;border-radius:12px;padding:12px 15px;font-weight:800}
button.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-weight:800}
button.linkish{border:0;background:none;color:#1677ff;font-weight:800;padding:6px}
button.danger{background:#fff;border:1px solid #fecaca;color:var(--danger);border-radius:12px;padding:10px 12px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:999px;padding:15px 19px;background:#111827;color:#fff;font-weight:800;box-shadow:0 6px 20px #0003}
.empty{text-align:center;padding:30px;color:var(--muted)}
.notice{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.warning{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.small{font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:15px 0}
.group{border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;background:#fafafa}
.exerciseRow{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.exerciseHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.exerciseHead input{font-weight:700}
.setGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.setRow{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}
.setNo{text-align:center;font-weight:800;color:var(--muted)}
.compact{padding:9px 10px;font-size:14px}
.hidden{display:none!important}
.kpi{font-size:13px;color:var(--muted)}
table.exportPreview{width:100%;border-collapse:collapse;font-size:12px}
table.exportPreview th,table.exportPreview td{border:1px solid var(--line);padding:6px;text-align:left}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.setGrid{grid-template-columns:1fr 1fr}.setRow{grid-template-columns:28px 1fr 1fr 34px}}
</style>
</head>
<body>
<header><h1>My Gym Tracker</h1><div class="sub">Structured, searchable, and yours</div></header>
<nav id="nav">
<button data-tab="home">Home</button><button data-tab="history">History</button><button data-tab="exercises">Exercises</button><button data-tab="stats">Stats</button>
</nav>
<main id="app"></main>
<button class="fab" id="newBtn">＋ New Workout</button>

<script src="data.js"></script>
<script>
const seed=(window.GYM_DATA&&window.GYM_DATA.workouts)||[];
const V3='gymTrackerWorkoutsV3';
const V2='gymTrackerWorkoutsV2';
let workouts=JSON.parse(localStorage.getItem(V3)||'null');
if(!workouts){
  workouts=JSON.parse(localStorage.getItem(V2)||'null')||seed;
  localStorage.setItem(V3,JSON.stringify(workouts));
}
let tab='home';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmtDate=iso=>{const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function save(){localStorage.setItem(V3,JSON.stringify(workouts))}
function allItems(){
  return workouts.flatMap(w=>(w.sections||[]).flatMap(s=>(s.items||[]).map(i=>({...i,date:w.date,section:s.name}))))
}
function itemMeta(i){
  const bits=[];
  if(i.sets) bits.push(`${esc(i.sets)} sets`);
  if(i.weight) bits.push(esc(i.weight));
  if(i.reps) bits.push(`${esc(i.reps)} reps`);
  if(i.duration) bits.push(esc(i.duration));
  if(i.notes?.length) bits.push(esc(i.notes.join('; ')));
  return bits.join(' · ');
}
function card(w){
 return `<div class="card">
 <div class="row"><div class="date">${esc(fmtDate(w.date))}</div><span class="pill">${(w.sections||[]).length} section${(w.sections||[]).length===1?'':'s'}</span></div>
 ${(w.sections||[]).map(s=>`<div class="section"><h3>${esc(s.name)}</h3>${(s.items||[]).map(i=>`<div class="item"><b>${esc(i.name)}</b><div class="meta">${itemMeta(i)}</div>${i.set_details?.length?`<div class="small muted">${i.set_details.map((x,n)=>`Set ${n+1}: ${esc(x.weight||'—')} × ${esc(x.reps||'—')}`).join(' · ')}</div>`:''}</div>`).join('')}</div>`).join('')}
 </div>`;
}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='home')home(); if(tab==='history')history(); if(tab==='exercises')exercises(); if(tab==='stats')stats();
}
function home(){
 const recent=[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 const today=new Date().toISOString().slice(0,10);
 app.innerHTML=`<div class="grid">
 <div class="card"><div class="big">${workouts.length}</div><div class="muted">Workout days</div></div>
 <div class="card"><div class="big">${allItems().length}</div><div class="muted">Logged items</div></div></div>
 <div class="card notice"><b>Version 3 ready</b><p class="muted">One date can now contain multiple muscle groups and multiple exercises. Cardio has its own duration/details fields. Rest-day gaps are normal and are not treated as errors.</p></div>
 <h2>Recent</h2>${recent.map(card).join('')||'<div class="empty">No workouts yet.</div>'}`;
}
function history(){
 app.innerHTML=`<input class="search" id="hs" placeholder="Search date, muscle group, exercise..." /><div id="hl"></div>`;
 const draw=()=>{const q=document.getElementById('hs').value.toLowerCase();const arr=[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).filter(w=>JSON.stringify(w).toLowerCase().includes(q));document.getElementById('hl').innerHTML=arr.map(card).join('')||'<div class="empty">No matching workouts.</div>'};
 document.getElementById('hs').oninput=draw; draw();
}
function exercises(){
 const names=[...new Set(allItems().map(i=>i.name))].sort((a,b)=>a.localeCompare(b));
 app.innerHTML=`<input class="search" id="es" placeholder="Search an exercise..." /><div id="el"></div>`;
 const draw=()=>{const q=document.getElementById('es').value.toLowerCase();const n=names.filter(x=>x.toLowerCase().includes(q));document.getElementById('el').innerHTML=n.map(name=>{
 const hits=allItems().filter(i=>i.name===name).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><div class="row"><b>${esc(name)}</b><span class="pill">${hits.length} log${hits.length===1?'':'s'}</span></div>
 ${hits.map(h=>`<div class="item"><b>${esc(fmtDate(h.date))}</b><div class="meta">${esc(h.section)}${itemMeta(h)?' · '+itemMeta(h):''}</div></div>`).join('')}</div>`}).join('')||'<div class="empty">No exercises found.</div>'};
 document.getElementById('es').oninput=draw;draw();
}
function stats(){
 const counts={};allItems().forEach(i=>counts[i.section]=(counts[i.section]||0)+1);
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
 app.innerHTML=`<div class="card"><h2>Activity by muscle group</h2>${top.map(([k,v])=>`<div class="row item"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>
 <div class="card"><h2>Export & backup</h2><p class="muted">Export your complete workout history whenever you want. Excel export creates a real .xlsx workbook; Word export creates a .doc report; JSON is the full backup.</p>
 <div class="actions"><button class="primary" id="xlsx">Export Excel</button><button class="secondary" id="word">Export Word</button><button class="secondary" id="json">Export JSON backup</button></div>
 <hr><p class="small muted">Your data is stored on this iPhone in the app's browser storage. Keep a JSON backup if the data matters to you.</p></div>`;
 document.getElementById('xlsx').onclick=exportXLSX;
 document.getElementById('word').onclick=exportWord;
 document.getElementById('json').onclick=exportJSON;
}
function newWorkout(){
 let draft={date:new Date().toISOString().slice(0,10),groups:[makeGroup()]};
 app.innerHTML=`<div class="card"><h2>New Workout</h2>
 <div class="formgrid"><div class="full"><label class="small muted">Date</label><input id="wd" type="date" value="${draft.date}"></div></div>
 <div id="groups"></div>
 <div class="actions"><button class="secondary" id="addGroup">＋ Add muscle group</button><button class="primary" id="saveAll">Save entire workout</button><button class="secondary" id="cancel">Cancel</button></div></div>`;
 const groupsEl=document.getElementById('groups');
 function makeGroup(){return {id:uid(),name:'',items:[makeItem()]}}
 function makeItem(){return {id:uid(),name:'',sets:'',weight:'',reps:'',duration:'',notes:'',detailed:false,set_details:[{weight:'',reps:''}]}}
 function draw(){
  groupsEl.innerHTML=draft.groups.map((g,gi)=>`<div class="group" data-g="${g.id}">
   <div class="row"><h3 style="margin:0">Muscle group ${gi+1}</h3>${draft.groups.length>1?`<button class="danger compact" data-remove-group="${g.id}">Remove</button>`:''}</div>
   <input data-group-name="${g.id}" placeholder="e.g. Back, Biceps, Chest, Cardio" value="${esc(g.name)}">
   <div class="items">${g.items.map((it,ii)=>`<div class="exerciseRow" data-i="${it.id}">
     <div class="exerciseHead"><input data-name="${it.id}" placeholder="Exercise / cardio activity" value="${esc(it.name)}">${g.items.length>1?`<button class="danger compact" data-remove-item="${it.id}">×</button>`:''}</div>
     <div class="setGrid">
       <input data-sets="${it.id}" inputmode="numeric" placeholder="Sets" value="${esc(it.sets)}">
       <input data-weight="${it.id}" placeholder="Weight (e.g. 65 kg)" value="${esc(it.weight)}">
       <input data-reps="${it.id}" placeholder="Reps (e.g. 6)" value="${esc(it.reps)}">
       <input data-duration="${it.id}" placeholder="Duration (e.g. 15 min)" value="${esc(it.duration)}">
     </div>
     <textarea data-notes="${it.id}" rows="2" placeholder="Notes: last set 35 kg × 6, drop set, interval details, etc.">${esc(it.notes)}</textarea>
     <div class="actions"><button class="secondary compact" data-detail="${it.id}">${it.detailed?'Hide set details':'＋ Detailed sets'}</button><button class="linkish compact" data-add-item="${g.id}">＋ Add exercise</button></div>
     ${it.detailed?`<div><div class="small muted">Optional set-by-set details</div>${it.set_details.map((s,si)=>`<div class="setRow"><div class="setNo">${si+1}</div><input data-sw="${it.id}:${si}" placeholder="Weight" value="${esc(s.weight)}"><input data-sr="${it.id}:${si}" placeholder="Reps" value="${esc(s.reps)}"><button class="danger compact" data-remove-set="${it.id}:${si}">×</button></div>`).join('')}<button class="secondary compact" data-add-set="${it.id}">＋ Add set</button></div>`:''}
   </div>`).join('')}
  </div>`).join('')}`;
  bind();
 }
 function findItem(id){for(const g of draft.groups){const x=g.items.find(i=>i.id===id);if(x)return x}}
 function bind(){
  groupsEl.querySelectorAll('[data-group-name]').forEach(e=>e.oninput=()=>{const g=draft.groups.find(x=>x.id===e.dataset.groupName);g.name=e.value});
  groupsEl.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>findItem(e.dataset.name).name=e.value);
  groupsEl.querySelectorAll('[data-sets]').forEach(e=>e.oninput=()=>findItem(e.dataset.sets).sets=e.value);
  groupsEl.querySelectorAll('[data-weight]').forEach(e=>e.oninput=()=>findItem(e.dataset.weight).weight=e.value);
  groupsEl.querySelectorAll('[data-reps]').forEach(e=>e.oninput=()=>findItem(e.dataset.reps).reps=e.value);
  groupsEl.querySelectorAll('[data-duration]').forEach(e=>e.oninput=()=>findItem(e.dataset.duration).duration=e.value);
  groupsEl.querySelectorAll('[data-notes]').forEach(e=>e.oninput=()=>findItem(e.dataset.notes).notes=e.value);
  groupsEl.querySelectorAll('[data-add-item]').forEach(e=>e.onclick=()=>{draft.groups.find(g=>g.id===e.dataset.addItem).items.push(makeItem());draw()});
  groupsEl.querySelectorAll('[data-remove-item]').forEach(e=>e.onclick=()=>{for(const g of draft.groups){g.items=g.items.filter(i=>i.id!==e.dataset.removeItem)};draw()});
  groupsEl.querySelectorAll('[data-remove-group]').forEach(e=>e.onclick=()=>{draft.groups=draft.groups.filter(g=>g.id!==e.dataset.removeGroup);draw()});
  groupsEl.querySelectorAll('[data-detail]').forEach(e=>e.onclick=()=>{const i=findItem(e.dataset.detail);i.detailed=!i.detailed;draw()});
  groupsEl.querySelectorAll('[data-add-set]').forEach(e=>e.onclick=()=>{findItem(e.dataset.addSet).set_details.push({weight:'',reps:''});draw()});
  groupsEl.querySelectorAll('[data-remove-set]').forEach(e=>e.onclick=()=>{const [id,si]=e.dataset.removeSet.split(':');const i=findItem(id);i.set_details.splice(Number(si),1);draw()});
  groupsEl.querySelectorAll('[data-sw]').forEach(e=>e.oninput=()=>{const [id,si]=e.dataset.sw.split(':');findItem(id).set_details[Number(si)].weight=e.value});
  groupsEl.querySelectorAll('[data-sr]').forEach(e=>e.oninput=()=>{const [id,si]=e.dataset.sr.split(':');findItem(id).set_details[Number(si)].reps=e.value});
 }
 document.getElementById('addGroup').onclick=()=>{draft.groups.push(makeGroup());draw()};
 document.getElementById('cancel').onclick=()=>render();
 document.getElementById('saveAll').onclick=()=>{
  const date=document.getElementById('wd').value;
  const groups=draft.groups.map(g=>({name:g.name.trim(),items:g.items.filter(i=>i.name.trim()).map(i=>({
    name:i.name.trim(),raw:i.name.trim(),sets:i.sets.trim()||null,weight:i.weight.trim()||null,reps:i.reps.trim()||null,duration:i.duration.trim()||null,notes:i.notes.trim()?[i.notes.trim()]:[],set_details:i.detailed?i.set_details.filter(s=>s.weight||s.reps):[]
  }))})).filter(g=>g.name&&g.items.length);
  if(!date||!groups.length){alert('Enter a date, at least one muscle group, and at least one exercise.');return}
  const existing=workouts.find(w=>w.date===date);
  if(existing){
    groups.forEach(g=>{let s=existing.sections.find(x=>x.name.toLowerCase()===g.name.toLowerCase());if(!s){s={name:g.name,items:[]};existing.sections.push(s)}s.items.push(...g.items)});
  }else workouts.push({date,source_date:fmtDate(date),date_note:'',sections:groups});
  save();tab='history';render();
 };
 draw();
}
function exportJSON(){
 const blob=new Blob([JSON.stringify(workouts,null,2)],{type:'application/json'});
 downloadBlob(blob,'gym-tracker-backup.json');
}
function xmlEscape(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function csvCell(s){return `"${String(s??'').replace(/"/g,'""')}"`}
function flatRows(){
 const rows=[['Date','Muscle Group','Exercise','Sets','Weight','Reps','Duration','Notes','Set Details']];
 workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>(w.sections||[]).forEach(s=>(s.items||[]).forEach(i=>{
  rows.push([fmtDate(w.date),s.name,i.name,i.sets||'',i.weight||'',i.reps||'',i.duration||'',(i.notes||[]).join('; '),(i.set_details||[]).map((x,n)=>`Set ${n+1}: ${x.weight||''} x ${x.reps||''}`).join('; ')]);
 })));
 return rows;
}
function exportWord(){
 const rows=flatRows();
 let body=`<h1>My Gym Tracker</h1><p>Workout history exported ${new Date().toLocaleDateString()}</p>`;
 let current='';
 workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
  body+=`<h2>${xmlEscape(fmtDate(w.date))}</h2>`;
  (w.sections||[]).forEach(s=>{body+=`<h3>${xmlEscape(s.name)}</h3><ul>`;(s.items||[]).forEach(i=>{body+=`<li><b>${xmlEscape(i.name)}</b> — ${xmlEscape(itemMetaPlain(i))}</li>`});body+='</ul>'});
 });
 const htmlDoc=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;margin:40px}h1{font-size:24pt}h2{margin-top:24px}li{margin:7px 0}</style></head><body>${body}</body></html>`;
 downloadBlob(new Blob([htmlDoc],{type:'application/msword'}),'gym-tracker-report.doc');
}
function itemMetaPlain(i){
 const bits=[]; if(i.sets)bits.push(`${i.sets} sets`);if(i.weight)bits.push(i.weight);if(i.reps)bits.push(`${i.reps} reps`);if(i.duration)bits.push(i.duration);if(i.notes?.length)bits.push(i.notes.join('; '));
 if(i.set_details?.length)bits.push(i.set_details.map((x,n)=>`Set ${n+1}: ${x.weight||'—'} x ${x.reps||'—'}`).join(', '));
 return bits.join(' · ');
}
function downloadBlob(blob,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* Minimal XLSX writer: creates a valid .xlsx ZIP with stored (uncompressed) XML parts. */
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){let len=parts.reduce((n,p)=>n+p.length,0),o=new Uint8Array(len),i=0;for(const p of parts){o.set(p,i);i+=p.length}return o}
function zipStore(files){
 const enc=new TextEncoder(), locals=[], centrals=[]; let offset=0;
 for(const f of files){
  const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
  const local=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
  locals.push(local);
  const central=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
  centrals.push(central); offset+=local.length;
 }
 const cdOffset=offset, cdSize=centrals.reduce((n,p)=>n+p.length,0), end=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdOffset),u16(0)]);
 return concatBytes([...locals,...centrals,end]);
}
function xlsxCell(v){
 const s=xmlEscape(v); return `<c t="inlineStr"><is><t>${s}</t></is></c>`;
}
function exportXLSX(){
 const rows=flatRows();
 const sheetRows=rows.map((r,ri)=>`<row r="${ri+1}">${r.map(xlsxCell).join('')}</row>`).join('');
 const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`;
 const files=[
  {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`},
